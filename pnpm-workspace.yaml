# esbuild (via Vite) needs its postinstall to fetch the platform binary; pnpm 11
# blocks install scripts unless allowed here.
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - '@asucregonzalez/section-delivery-projects@0.11.5'
  - '@asucregonzalez/section-eng-health@0.1.0'
  - '@asucregonzalez/section-worktrees@0.1.1'
  - '@asucregonzalez/section-worktrees@0.2.0'
  - '@asucregonzalez/section-journal@0.2.0'
  - '@asucregonzalez/section-meetings@0.3.0'
  - '@asucregonzalez/section-pull-requests@0.7.0'
  - '@asucregonzalez/section-tasks@0.4.0'
